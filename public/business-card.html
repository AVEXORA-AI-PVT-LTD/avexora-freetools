<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Business Card</title>
<meta name="description" content="Digital business card — tap to call, message, email, save contact or share.">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     THEME TOKENS
     Brand colours are set from CONFIG.colors in the script below.
     ============================================================ */
  :root {
    --primary: #6C5CE7;
    --secondary: #00B8D9;
    --accent: #FF6B9D;

    --bg: #eceef6;
    --card: #ffffff;
    --text: #13141c;
    --muted: #666c80;
    --line: rgba(19, 20, 28, 0.08);
    --row: #f5f6fb;
    --row-hover: #ffffff;
    --shadow: 0 40px 80px -30px rgba(40, 30, 110, 0.35), 0 12px 24px -12px rgba(0, 0, 0, 0.12);
    --glow: color-mix(in srgb, var(--primary) 38%, transparent);

    --radius: 28px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #08090f;
      --card: #141621;
      --text: #f2f3f8;
      --muted: #9aa0b5;
      --line: rgba(255, 255, 255, 0.08);
      --row: #1b1e2c;
      --row-hover: #222638;
      --shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.8), 0 12px 24px -12px rgba(0, 0, 0, 0.5);
      --glow: color-mix(in srgb, var(--primary) 55%, transparent);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #08090f;
    --card: #141621;
    --text: #f2f3f8;
    --muted: #9aa0b5;
    --line: rgba(255, 255, 255, 0.08);
    --row: #1b1e2c;
    --row-hover: #222638;
    --shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.8), 0 12px 24px -12px rgba(0, 0, 0, 0.5);
    --glow: color-mix(in srgb, var(--primary) 55%, transparent);
    color-scheme: dark;
  }

  /* ============================================================
     BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(60vmax 60vmax at 0% 0%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 60%),
      radial-gradient(50vmax 50vmax at 100% 100%, color-mix(in srgb, var(--secondary) 14%, transparent), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    transition: background-color .4s ease, color .4s ease;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 70%, white); outline-offset: 3px; border-radius: 14px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .stage {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  @media (min-width: 520px) { .stage { align-items: center; min-height: 100vh; min-height: 100dvh; padding: 40px 16px; } }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    isolation: isolate;
    transition: background-color .4s ease, box-shadow .4s ease;
  }

  /* ============================================================
     MOTION HEADER
     ============================================================ */
  .banner {
    position: relative;
    height: 232px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 50%, var(--secondary)) 55%, var(--secondary) 100%);
    animation: bannerIn .9s var(--ease-out) both;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(28px);
    opacity: .75;
    will-change: transform;
  }
  .blob.b1 { width: 260px; height: 260px; left: -70px; top: -90px; background: radial-gradient(circle at 40% 40%, var(--accent), transparent 68%); animation: drift1 16s ease-in-out infinite alternate; }
  .blob.b2 { width: 240px; height: 240px; right: -80px; top: -20px; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--secondary) 70%, white), transparent 66%); animation: drift2 19s ease-in-out infinite alternate; mix-blend-mode: screen; }
  .blob.b3 { width: 300px; height: 300px; left: 40px; bottom: -190px; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--primary) 60%, black), transparent 65%); animation: drift3 22s ease-in-out infinite alternate; }
  .blob.b4 { width: 140px; height: 140px; left: 55%; top: 30%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 60%, white), transparent 70%); opacity: .45; animation: drift4 13s ease-in-out infinite alternate; mix-blend-mode: soft-light; }

  .shape {
    position: absolute;
    border: 1.5px solid rgba(255, 255, 255, .28);
    will-change: transform;
  }
  .shape.ring { width: 120px; height: 120px; border-radius: 50%; right: 18%; top: 22%; animation: floatSpin 24s linear infinite; }
  .shape.square { width: 46px; height: 46px; border-radius: 12px; left: 14%; top: 42%; animation: floatSpin 30s linear infinite reverse; }
  .shape.dot { width: 10px; height: 10px; border: 0; border-radius: 50%; background: rgba(255,255,255,.55); left: 72%; top: 18%; animation: bob 7s ease-in-out infinite; }

  #particles { position: absolute; inset: 0; width: 100%; height: 100%; }

  .banner::after { /* soft vignette so the avatar and chips always read well */
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.12) 0%, transparent 35%, transparent 70%, rgba(0,0,0,.14) 100%);
    pointer-events: none;
  }

  .topbar {
    position: absolute; z-index: 2;
    top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 8px;
    border-radius: 999px;
    color: #fff;
    font-size: 12.5px; font-weight: 500; letter-spacing: .02em;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 70%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .mark { width: 18px; height: 18px; border-radius: 6px; flex: none; background: linear-gradient(135deg, #fff, rgba(255,255,255,.55)); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--accent) 80%, transparent); }
  .icon-btn {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    border-radius: 50%;
    color: #fff;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: transform .25s var(--ease-back), background-color .25s ease;
  }
  .icon-btn:hover { transform: translateY(-2px) rotate(-12deg); background: rgba(255,255,255,.28); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn .moon { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-btn .sun { display: none; }
    :root:not([data-theme="light"]) .icon-btn .moon { display: block; }
  }

  /* ============================================================
     AVATAR
     ============================================================ */
  .avatar-wrap {
    position: relative; z-index: 3;
    display: flex; justify-content: center;
    margin-top: -62px;
  }
  .avatar {
    position: relative;
    width: 124px; height: 124px;
    border-radius: 50%;
    padding: 5px;
    background: var(--card);
    animation: avatarPop .9s var(--ease-out) both;
    animation-delay: var(--d, 450ms);
    transition: background-color .4s ease;
  }
  .avatar::before { /* slowly rotating brand ring */
    content: "";
    position: absolute; inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--accent), var(--primary));
    z-index: -1;
    animation: spin 9s linear infinite;
  }
  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    font-weight: 600; font-size: 38px; letter-spacing: .02em;
  }
  .avatar-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============================================================
     IDENTITY
     ============================================================ */
  .identity { text-align: center; padding: 14px 24px 4px; }
  .name { margin: 0; font-size: clamp(24px, 6.4vw, 28px); line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
  .role { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); font-weight: 500; }
  .role strong {
    font-weight: 600;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline {
    margin: 12px auto 0;
    max-width: 30ch;
    font-size: 13.5px; line-height: 1.55;
    color: var(--muted);
  }

  /* ============================================================
     ACTION BUTTONS
     ============================================================ */
  .actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 20px 20px 6px;
  }
  .btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px;
    padding: 0 12px;
    border-radius: 16px;
    white-space: nowrap;
    border: 0;
    font-size: 14.5px; font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    transition: transform .25s var(--ease-out), box-shadow .3s ease, background-color .3s ease, filter .3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 45%, var(--secondary)));
    box-shadow: 0 10px 22px -10px var(--glow);
  }
  .btn-primary::after { /* shine sweep on hover */
    content: "";
    position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-20deg);
    transition: left .6s var(--ease-out);
  }
  .btn-primary:hover::after { left: 120%; }
  .btn-ghost {
    background: var(--row);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .btn:hover { transform: translateY(-3px); }
  .btn-primary:hover { box-shadow: 0 16px 30px -10px var(--glow); filter: saturate(1.1); }
  .btn-ghost:hover { background: var(--row-hover); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 45%, transparent), 0 12px 24px -14px var(--glow); color: var(--primary); }
  .btn:active { transform: translateY(0) scale(.97); }

  /* ============================================================
     CONTACT ROWS
     ============================================================ */
  .contacts { list-style: none; margin: 0; padding: 14px 20px 4px; display: grid; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px 12px 12px;
    border-radius: 18px;
    background: var(--row);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .3s var(--ease-out), box-shadow .3s ease, background-color .3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .row:hover { transform: translateY(-2px); background: var(--row-hover); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent), 0 14px 28px -16px var(--glow); }
  .row:active { transform: scale(.985); }
  .row-ic {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    border-radius: 14px;
    color: var(--c, var(--primary));
    background: color-mix(in srgb, var(--c, var(--primary)) 13%, transparent);
    transition: transform .35s var(--ease-back), background-color .3s ease, color .3s ease;
  }
  .row-ic svg { width: 21px; height: 21px; }
  .row:hover .row-ic { transform: rotate(-8deg) scale(1.08); background: var(--c, var(--primary)); color: #fff; }
  .row-txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .row-txt small { font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row-txt span { font-size: 14.5px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
  .row-go { flex: none; color: var(--muted); opacity: .6; transition: transform .3s var(--ease-out), opacity .3s ease, color .3s ease; }
  .row-go svg { width: 18px; height: 18px; display: block; }
  .row:hover .row-go { transform: translateX(3px); opacity: 1; color: var(--primary); }

  /* ============================================================
     QR
     ============================================================ */
  .qr {
    margin: 16px 20px 0;
    padding: 14px;
    display: flex; align-items: center; gap: 16px;
    border-radius: 20px;
    background:
      linear-gradient(var(--row), var(--row)) padding-box,
      linear-gradient(135deg, color-mix(in srgb, var(--primary) 45%, transparent), color-mix(in srgb, var(--accent) 45%, transparent)) border-box;
    border: 1px solid transparent;
  }
  .qr-code {
    width: 104px; height: 104px; flex: none;
    padding: 6px;
    border-radius: 14px;
    background: #fff; /* always dark-on-light for reliable scanning */
    box-shadow: 0 8px 20px -12px rgba(0,0,0,.35);
  }
  .qr-code svg { width: 100%; height: 100%; display: block; }
  .qr-txt { min-width: 0; }
  .qr-txt h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .qr-txt p { margin: 4px 0 10px; font-size: 12.5px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 10px;
    border: 0;
    font-size: 12.5px; font-weight: 600;
    color: var(--primary);
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    cursor: pointer;
    transition: transform .25s var(--ease-out), background-color .25s ease;
  }
  .link-btn svg { width: 14px; height: 14px; }
  .link-btn:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--primary) 20%, transparent); }

  /* ============================================================
     SOCIALS + FOOTER
     ============================================================ */
  .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px 20px 6px; }
  .social {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 15px;
    color: var(--text);
    background: var(--row);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .3s var(--ease-back), background-color .3s ease, color .3s ease, box-shadow .3s ease;
  }
  .social svg { width: 20px; height: 20px; }
  .social:hover { transform: translateY(-4px) scale(1.06); color: #fff; background: var(--c, var(--primary)); box-shadow: 0 12px 22px -10px var(--c, var(--glow)); }
  .social:active { transform: scale(.94); }

  .foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 14px 20px 22px; opacity: .8; }

  /* ============================================================
     TOAST
     ============================================================ */
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    padding: 11px 18px;
    border-radius: 999px;
    background: #13141c; color: #fff;
    font-size: 13.5px; font-weight: 500;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .35s var(--ease-out);
    z-index: 10;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  :root[data-theme="dark"] .toast { background: #f2f3f8; color: #13141c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #f2f3f8; color: #13141c; } }

  /* ============================================================
     ENTRANCE ANIMATIONS (delays set per element via --d)
     ============================================================ */
  .rise    { animation: rise .7s var(--ease-out) both; animation-delay: var(--d, 0ms); }
  .slide   { animation: slideIn .7s var(--ease-out) both; animation-delay: var(--d, 0ms); }
  .slide .row-ic { animation: iconPop .8s var(--ease-back) backwards; animation-delay: calc(var(--d, 0ms) + 180ms); }
  .pop     { animation: popIn .6s var(--ease-back) backwards; animation-delay: var(--d, 0ms); }

  @keyframes bannerIn { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes avatarPop {
    0%   { opacity: 0; transform: scale(.35) translateY(18px); }
    55%  { opacity: 1; transform: scale(1.08) translateY(0); }
    75%  { transform: scale(.97); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes rise    { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes iconPop {
    0%   { transform: scale(.5) rotate(-35deg); }
    60%  { transform: scale(1.15) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.5); } to { opacity: 1; transform: none; } }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes drift1 { to { transform: translate(90px, 60px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-80px, 50px) scale(.9); } }
  @keyframes drift3 { to { transform: translate(90px, -40px) scale(1.1); } }
  @keyframes drift4 { to { transform: translate(-60px, 30px) scale(1.3); } }
  @keyframes floatSpin { 0% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(180deg); } 100% { transform: translateY(0) rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

  /* ============================================================
     ACCESSIBILITY — reduced motion
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
    .blob, .shape, .avatar::before { animation: none !important; }
  }

  @media (max-width: 360px) {
    .actions { grid-template-columns: 1fr; }
    .qr { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>
<main class="stage">
  <article class="card" aria-labelledby="card-name">

    <!-- Motion header -->
    <header class="banner" aria-hidden="false">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
      <div class="shape ring"></div>
      <div class="shape square"></div>
      <div class="shape dot"></div>
      <canvas id="particles" aria-hidden="true"></canvas>
      <div class="topbar">
        <span class="chip" id="company-chip"><span class="mark" aria-hidden="true"></span><span></span></span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Profile photo / logo -->
    <div class="avatar-wrap">
      <div class="avatar"><div class="avatar-inner" id="avatar"></div></div>
    </div>

    <!-- Name, title, tagline -->
    <section class="identity">
      <h1 class="name rise" id="card-name" style="--d:750ms"></h1>
      <p class="role rise" id="card-role" style="--d:880ms"></p>
      <p class="tagline rise" id="card-tagline" style="--d:1010ms"></p>
    </section>

    <!-- Save / Share -->
    <div class="actions rise" style="--d:1140ms">
      <button class="btn btn-primary" id="save-btn" type="button"></button>
      <button class="btn btn-ghost" id="share-btn" type="button"></button>
    </div>

    <!-- Contact rows (built from CONFIG) -->
    <ul class="contacts" id="contacts" aria-label="Contact details"></ul>

    <!-- QR -->
    <section class="qr rise" id="qr" aria-labelledby="qr-title">
      <div class="qr-code" id="qr-code" role="img"></div>
      <div class="qr-txt">
        <h2 id="qr-title">Scan to visit</h2>
        <p id="qr-url"></p>
        <button class="link-btn" id="copy-btn" type="button"></button>
      </div>
    </section>

    <!-- Social icons (built from CONFIG) -->
    <nav class="socials" id="socials" aria-label="Social profiles"></nav>

    <p class="foot" id="foot"></p>
  </article>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="text-align:center;padding:24px">Please enable JavaScript to view this business card.</p></noscript>

<script>
/* =====================================================================
   ✏️  EDIT YOUR DETAILS HERE — this is the only section you need to change.
   Leave any field as "" to hide it from the card and the vCard.
   ===================================================================== */
const CONFIG = {
  name:        "Your Name",
  title:       "Your Title",
  company:     "Company Name",
  tagline:     "One-line tagline that sums up what you do.",

  phone:       "+91 98765 43210",        // tap to call
  whatsapp:    "+91 98765 43210",        // opens a WhatsApp chat (country code required)
  whatsappMessage: "Hi! I found you through your digital business card.",
  email:       "hello@example.com",      // opens mail app
  website:     "https://www.example.com",// also used for the QR code
  address:     "123 Business Street, City, State 000000, Country", // opens Google Maps

  // Optional profile photo / logo: a data URI ("data:image/jpeg;base64,...") keeps the file
  // self-contained; a relative/absolute URL also works. Leave "" to show initials.
  photo:       "",

  // URL used by the Share button. Leave "" to share the address of this page.
  shareUrl:    "",

  // Brand colours
  colors: {
    primary:   "#6C5CE7",
    secondary: "#00B8D9",
    accent:    "#FF6B9D",
  },

  // Social links — supported types: linkedin, instagram, facebook, x, youtube, github, behance, dribbble
  // Remove a line to hide that icon.
  socials: [
    { type: "linkedin",  url: "https://www.linkedin.com/in/your-profile" },
    { type: "instagram", url: "https://www.instagram.com/your-handle" },
    { type: "facebook",  url: "https://www.facebook.com/your-page" },
    { type: "x",         url: "https://x.com/your-handle" },
    { type: "youtube",   url: "https://www.youtube.com/@your-channel" },
  ],
};
/* ========================= END OF EDITABLE SECTION ========================= */


(function () {
  "use strict";

  /* ---------- Icons (inline SVG, no external images) ---------- */
  const ICONS = {
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    whatsapp: '<path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 8.6c.2-.4.5-.5.8-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .5-.1.7l-.5.6c-.1.1-.1.3 0 .5.6 1 1.4 1.8 2.4 2.3.2.1.4.1.5-.1l.6-.7c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.3.3.5v.4c0 .4-.2.8-.6 1-.6.3-1.3.4-2 .2-2.4-.7-4.4-2.7-5.1-5.1-.2-.8-.1-1.6.2-2.5z" fill="currentColor" stroke="none"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    chevron: '<path d="m9 18 6-6-6-6"/>',
    download: '<path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    instagram: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
    facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    x: '<path d="M4 4l11.73 16H20L8.27 4z"/><path d="M4 20l6.77-6.77M13.23 10.77 20 4"/>',
    youtube: '<path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/>',
    github: '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
    behance: '<path d="M3 6h5.5a3 3 0 0 1 0 6H3z"/><path d="M3 12h6.5a3 3 0 0 1 0 6H3z"/><path d="M14 13.5h7a3.5 3.5 0 1 0-1 3"/><path d="M15 7h5"/>',
    dribbble: '<circle cx="12" cy="12" r="10"/><path d="M19.13 5.09C15.22 9.14 10 10.44 2.25 10.94"/><path d="M21.75 12.84c-6.62-1.41-12.14 1-16.38 6.32"/><path d="M8.56 2.75c4.37 6 6 9.42 8 17.72"/>',
  };
  const SOCIAL_META = {
    linkedin:  { label: "LinkedIn",  color: "#0A66C2" },
    instagram: { label: "Instagram", color: "#E1306C" },
    facebook:  { label: "Facebook",  color: "#1877F2" },
    x:         { label: "X",         color: "#111111" },
    youtube:   { label: "YouTube",   color: "#FF0000" },
    github:    { label: "GitHub",    color: "#24292F" },
    behance:   { label: "Behance",   color: "#1769FF" },
    dribbble:  { label: "Dribbble",  color: "#EA4C89" },
  };
  const svg = (name) =>
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (ICONS[name] || ICONS.globe) + "</svg>";

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const reduceMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* ---------- Helpers ---------- */
  const telHref = (n) => "tel:" + n.replace(/[^\d+]/g, "");
  const waHref = (n, msg) =>
    "https://wa.me/" + n.replace(/\D/g, "") + (msg ? "?text=" + encodeURIComponent(msg) : "");
  const mapsHref = (a) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a);
  const prettyUrl = (u) => u.replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/$/, "");
  const initials = (n) =>
    n.trim().split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "•";
  const shareUrl = () => CONFIG.shareUrl || location.href.split("#")[0];

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "html") node.innerHTML = v;
      else if (k === "text") node.textContent = v;
      else if (k === "style") node.style.cssText = v;
      else node.setAttribute(k, v);
    }
    (children || []).forEach((c) => c && node.append(c));
    return node;
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      const ta = el("textarea", { style: "position:fixed;opacity:0;top:0;left:0" });
      ta.value = text;
      document.body.append(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  /* ---------- Brand colours ---------- */
  const { primary, secondary, accent } = CONFIG.colors || {};
  if (primary) root.style.setProperty("--primary", primary);
  if (secondary) root.style.setProperty("--secondary", secondary);
  if (accent) root.style.setProperty("--accent", accent);

  /* ---------- Identity ---------- */
  document.title = [CONFIG.name, CONFIG.company].filter(Boolean).join(" · ") || "Digital Business Card";
  $("card-name").textContent = CONFIG.name;
  const role = $("card-role");
  if (CONFIG.title) role.append(CONFIG.title);
  if (CONFIG.title && CONFIG.company) role.append(" at ");
  if (CONFIG.company) role.append(el("strong", { text: CONFIG.company }));
  $("card-tagline").textContent = CONFIG.tagline;
  if (!CONFIG.tagline) $("card-tagline").hidden = true;
  $("company-chip").lastElementChild.textContent = CONFIG.company || CONFIG.name;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + (CONFIG.company || CONFIG.name) + " · Tap any detail to connect";

  const avatar = $("avatar");
  if (CONFIG.photo) {
    const img = el("img", { src: CONFIG.photo, alt: CONFIG.name, decoding: "async" });
    img.onerror = () => { avatar.textContent = initials(CONFIG.name); };
    avatar.append(img);
  } else {
    avatar.textContent = initials(CONFIG.name);
    avatar.setAttribute("aria-hidden", "true");
  }

  /* ---------- Buttons ---------- */
  $("save-btn").innerHTML = svg("download") + "<span>Save Contact</span>";
  $("share-btn").innerHTML = svg("share") + "<span>Share</span>";
  $("copy-btn").innerHTML = svg("copy") + "<span>Copy link</span>";

  /* ---------- Contact rows ---------- */
  const rows = [
    CONFIG.phone && { icon: "phone", label: "Call", value: CONFIG.phone, href: telHref(CONFIG.phone), color: CONFIG.colors.primary },
    CONFIG.whatsapp && { icon: "whatsapp", label: "WhatsApp", value: CONFIG.whatsapp, href: waHref(CONFIG.whatsapp, CONFIG.whatsappMessage), external: true, color: "#25D366" },
    CONFIG.email && { icon: "mail", label: "Email", value: CONFIG.email, href: "mailto:" + CONFIG.email, color: CONFIG.colors.accent },
    CONFIG.website && { icon: "globe", label: "Website", value: prettyUrl(CONFIG.website), href: CONFIG.website, external: true, color: CONFIG.colors.secondary },
    CONFIG.address && { icon: "pin", label: "Address", value: CONFIG.address, href: mapsHref(CONFIG.address), external: true, color: "#F59E0B" },
  ].filter(Boolean);

  const ROW_START = 1250, ROW_STEP = 120;
  const list = $("contacts");
  rows.forEach((r, i) => {
    const a = el("a", {
      class: "row",
      href: r.href,
      target: r.external ? "_blank" : null,
      rel: r.external ? "noopener noreferrer" : null,
      "aria-label": r.label + ": " + r.value,
    }, [
      el("span", { class: "row-ic", html: svg(r.icon), style: r.color ? "--c:" + r.color : null }),
      el("span", { class: "row-txt" }, [el("small", { text: r.label }), el("span", { text: r.value })]),
      el("span", { class: "row-go", html: svg("chevron") }),
    ]);
    list.append(el("li", { class: "slide", style: "--d:" + (ROW_START + i * ROW_STEP) + "ms" }, [a]));
  });
  let t = ROW_START + rows.length * ROW_STEP + 60;

  /* ---------- QR ---------- */
  if (CONFIG.website) {
    $("qr").style.setProperty("--d", t + "ms");
    $("qr-url").textContent = prettyUrl(CONFIG.website);
    const code = $("qr-code");
    code.setAttribute("aria-label", "QR code linking to " + prettyUrl(CONFIG.website));
    try { code.innerHTML = qrSvg(CONFIG.website); } catch (e) { $("qr").hidden = true; }
    $("copy-btn").addEventListener("click", async () => {
      toast((await copyText(CONFIG.website)) ? "Website link copied" : "Couldn't copy — long-press the link instead");
    });
    t += 140;
  } else {
    $("qr").hidden = true;
  }

  /* ---------- Socials ---------- */
  const socials = $("socials");
  (CONFIG.socials || []).filter((s) => s && s.url).forEach((s, i) => {
    const meta = SOCIAL_META[s.type] || { label: s.type, color: CONFIG.colors.primary };
    socials.append(el("a", {
      class: "social pop",
      href: s.url,
      target: "_blank",
      rel: "noopener noreferrer",
      "aria-label": meta.label,
      title: meta.label,
      style: "--d:" + (t + i * 90) + "ms;--c:" + meta.color,
      html: svg(s.type),
    }));
  });
  if (!socials.children.length) socials.hidden = true;
  $("foot").classList.add("rise");
  $("foot").style.setProperty("--d", t + (CONFIG.socials || []).length * 90 + "ms");

  /* ---------- vCard ---------- */
  function vEsc(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  }
  function vFold(line) { // RFC 6350: fold lines longer than 75 characters
    if (line.length <= 75) return line;
    const out = [line.slice(0, 75)];
    for (let i = 75; i < line.length; i += 74) out.push(" " + line.slice(i, i + 74));
    return out.join("\r\n");
  }
  function buildVCard() {
    const parts = CONFIG.name.trim().split(/\s+/);
    const last = parts.length > 1 ? parts.pop() : "";
    const first = parts.join(" ");
    const L = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + vEsc(last) + ";" + vEsc(first) + ";;;",
      "FN:" + vEsc(CONFIG.name),
    ];
    if (CONFIG.company) L.push("ORG:" + vEsc(CONFIG.company));
    if (CONFIG.title) L.push("TITLE:" + vEsc(CONFIG.title));
    if (CONFIG.phone) L.push("TEL;TYPE=CELL,VOICE:" + CONFIG.phone.replace(/[^\d+]/g, ""));
    if (CONFIG.whatsapp && CONFIG.whatsapp.replace(/\D/g, "") !== (CONFIG.phone || "").replace(/\D/g, ""))
      L.push("TEL;TYPE=CELL:" + CONFIG.whatsapp.replace(/[^\d+]/g, ""));
    if (CONFIG.email) L.push("EMAIL;TYPE=INTERNET,WORK:" + CONFIG.email);
    if (CONFIG.website) L.push("URL:" + CONFIG.website);
    if (CONFIG.address) L.push("ADR;TYPE=WORK:;;" + vEsc(CONFIG.address) + ";;;;");
    (CONFIG.socials || []).forEach((s) => {
      if (s && s.url) L.push("X-SOCIALPROFILE;TYPE=" + s.type + ":" + s.url);
    });
    if (CONFIG.tagline) L.push("NOTE:" + vEsc(CONFIG.tagline));
    const photo = /^data:image\/(png|jpe?g|gif|webp);base64,(.+)$/i.exec(CONFIG.photo || "");
    if (photo) L.push("PHOTO;ENCODING=b;TYPE=" + photo[1].toUpperCase().replace("JPG", "JPEG") + ":" + photo[2]);
    L.push("REV:" + new Date().toISOString());
    L.push("END:VCARD");
    return L.map(vFold).join("\r\n") + "\r\n";
  }
  $("save-btn").addEventListener("click", () => {
    const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = el("a", { href: url, download: (CONFIG.name || "contact").trim().replace(/[^\w\-]+/g, "_") + ".vcf" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Contact file downloaded");
  });

  /* ---------- Share ---------- */
  $("share-btn").addEventListener("click", async () => {
    const url = shareUrl();
    const data = {
      title: document.title,
      text: [CONFIG.name, CONFIG.title && CONFIG.company ? CONFIG.title + " at " + CONFIG.company : CONFIG.title || CONFIG.company].filter(Boolean).join(" — "),
      url,
    };
    if (navigator.share) {
      try { await navigator.share(data); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    toast((await copyText(url)) ? "Card link copied to clipboard" : "Couldn't copy — " + url);
  });

  /* ---------- Theme (auto + manual toggle) ---------- */
  const THEME_KEY = "bizcard-theme";
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  const readTheme = () => { try { return localStorage.getItem(THEME_KEY); } catch (_) { return null; } };
  const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : darkQuery.matches);
  const syncMeta = () => {
    document.querySelector('meta[name="theme-color"]').setAttribute("content", isDark() ? "#08090f" : (CONFIG.colors.primary || "#6C5CE7"));
  };
  const saved = readTheme();
  if (saved === "light" || saved === "dark") root.dataset.theme = saved;
  syncMeta();
  darkQuery.addEventListener && darkQuery.addEventListener("change", syncMeta);
  $("theme-toggle").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (_) { /* storage unavailable */ }
    syncMeta();
  });

  /* ---------- Particle field in the motion header ---------- */
  (function particles() {
    const canvas = $("particles");
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    let w = 0, h = 0, dpr = 1, dots = [], raf = 0, visible = true;
    const LINK = 78;

    function resize() {
      const r = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = r.width; h = r.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.max(16, Math.min(46, Math.round((w * h) / 2600)));
      dots = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.22,
        r: 0.8 + Math.random() * 1.8,
        a: 0.35 + Math.random() * 0.5,
      }));
      draw(false);
    }

    function draw(move) {
      ctx.clearRect(0, 0, w, h);
      for (const d of dots) {
        if (move) {
          d.x += d.vx; d.y += d.vy;
          if (d.x < -10) d.x = w + 10; else if (d.x > w + 10) d.x = -10;
          if (d.y < -10) d.y = h + 10; else if (d.y > h + 10) d.y = -10;
        }
      }
      ctx.lineWidth = 0.8;
      for (let i = 0; i < dots.length; i++) {
        for (let j = i + 1; j < dots.length; j++) {
          const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < LINK) {
            ctx.strokeStyle = "rgba(255,255,255," + (1 - dist / LINK) * 0.22 + ")";
            ctx.beginPath();
            ctx.moveTo(dots[i].x, dots[i].y);
            ctx.lineTo(dots[j].x, dots[j].y);
            ctx.stroke();
          }
        }
      }
      for (const d of dots) {
        ctx.fillStyle = "rgba(255,255,255," + d.a + ")";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() {
      draw(true);
      raf = requestAnimationFrame(loop);
    }
    function update() {
      cancelAnimationFrame(raf);
      raf = 0;
      if (!reduceMotionQuery.matches && visible && !document.hidden) raf = requestAnimationFrame(loop);
      else draw(false);
    }

    if ("ResizeObserver" in window) new ResizeObserver(() => { resize(); }).observe(canvas);
    else window.addEventListener("resize", resize);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver((entries) => { visible = entries[0].isIntersecting; update(); }).observe(canvas);
    }
    document.addEventListener("visibilitychange", update);
    reduceMotionQuery.addEventListener && reduceMotionQuery.addEventListener("change", update);
    resize();
    update();
  })();

  /* =====================================================================
     Minimal QR code generator (byte mode, error correction level M,
     versions 1–40). Based on the algorithm in the ISO/IEC 18004 spec.
     ===================================================================== */
  function qrSvg(text) {
    const m = qrMatrix(text);
    const n = m.length, quiet = 2;
    let d = "";
    for (let y = 0; y < n; y++)
      for (let x = 0; x < n; x++)
        if (m[y][x]) d += "M" + (x + quiet) + " " + (y + quiet) + "h1v1h-1z";
    const s = n + quiet * 2;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + " " + s + '" shape-rendering="crispEdges" aria-hidden="true"><path fill="#13141c" d="' + d + '"/></svg>';
  }

  function qrMatrix(text) {
    // Error correction level M tables, indexed by version
    const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
    const NUM_BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
    const ECL_FORMAT = 0; // M

    const rawModules = (v) => {
      let r = (16 * v + 128) * v + 64;
      if (v >= 2) {
        const na = Math.floor(v / 7) + 2;
        r -= (25 * na - 10) * na - 55;
        if (v >= 7) r -= 36;
      }
      return r;
    };
    const dataCodewords = (v) => Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[v] * NUM_BLOCKS[v];

    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 40; ver++) {
      const cc = ver < 10 ? 8 : 16;
      if (4 + cc + bytes.length * 8 <= dataCodewords(ver) * 8) break;
    }
    if (ver > 40) throw new Error("Text too long for QR code");

    // --- Build data bit stream
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4);
    push(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach((b) => push(b, 8));
    const capBits = dataCodewords(ver) * 8;
    push(0, Math.min(4, capBits - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < capBits; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      data.push(b);
    }

    // --- Reed–Solomon error correction and interleaving
    const gfMul = (x, y) => {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11d);
        z ^= ((y >>> i) & 1) * x;
      }
      return z;
    };
    const rsDivisor = (deg) => {
      const r = new Array(deg).fill(0);
      r[deg - 1] = 1;
      let root = 1;
      for (let i = 0; i < deg; i++) {
        for (let j = 0; j < deg; j++) {
          r[j] = gfMul(r[j], root);
          if (j + 1 < deg) r[j] ^= r[j + 1];
        }
        root = gfMul(root, 0x02);
      }
      return r;
    };
    const rsRemainder = (dat, div) => {
      const r = div.map(() => 0);
      for (const b of dat) {
        const f = b ^ r.shift();
        r.push(0);
        div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
      }
      return r;
    };
    const numBlocks = NUM_BLOCKS[ver], blockEcc = ECC_PER_BLOCK[ver];
    const rawCw = Math.floor(rawModules(ver) / 8);
    const numShort = numBlocks - (rawCw % numBlocks);
    const shortLen = Math.floor(rawCw / numBlocks);
    const div = rsDivisor(blockEcc);
    const blocks = [];
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const dat = data.slice(k, k + shortLen - blockEcc + (i < numShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if (i !== shortLen - blockEcc || j >= numShort) codewords.push(b[i]); });

    // --- Matrix and function patterns
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    const bit = (v, i) => ((v >>> i) & 1) !== 0;

    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++)
        for (let dx = -4; dx <= 4; dx++) {
          const dist = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
          if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, dist !== 2 && dist !== 4);
        }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    if (ver > 1) {
      const na = Math.floor(ver / 7) + 2;
      const step = Math.floor((ver * 8 + na * 3 + 5) / (na * 4 - 4)) * 2;
      const pos = [6];
      for (let p = size - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < na; i++)
        for (let j = 0; j < na; j++) {
          if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
          for (let dy = -2; dy <= 2; dy++)
            for (let dx = -2; dx <= 2; dx++)
              setF(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
    }
    const drawFormat = (mask) => {
      const dat = (ECL_FORMAT << 3) | mask;
      let rem = dat;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((dat << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(b, i));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(b, i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const a = size - 11 + (i % 3), c = Math.floor(i / 3);
        setF(a, c, bit(b, i)); setF(c, a, bit(b, i));
      }
    }

    // --- Place data (zig-zag)
    let idx = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++)
        for (let j = 0; j < 2; j++) {
          const x = right - j, upward = ((right + 1) & 2) === 0, y = upward ? size - 1 - vert : vert;
          if (!fn[y][x] && idx < codewords.length * 8) {
            mod[y][x] = bit(codewords[idx >>> 3], 7 - (idx & 7));
            idx++;
          }
        }
    }

    // --- Masking: pick the pattern with the lowest penalty
    const maskFn = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = (k) => {
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++)
          if (!fn[y][x] && maskFn[k](x, y)) mod[y][x] = !mod[y][x];
    };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let pass = 0; pass < 2; pass++)
        for (let a = 0; a < size; a++) {
          let run = 0, prev = null, line = "";
          for (let b = 0; b < size; b++) {
            const c = pass ? mod[b][a] : mod[a][b];
            line += c ? "1" : "0";
            if (c === prev) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
            else { prev = c; run = 1; }
          }
          const padded = "0000" + line + "0000";
          for (const pat of ["10111010000", "00001011101"])
            for (let i = padded.indexOf(pat); i !== -1; i = padded.indexOf(pat, i + 1)) p += 40;
        }
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++) {
          if (mod[y][x]) dark++;
          if (x < size - 1 && y < size - 1) {
            const c = mod[y][x];
            if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
          }
        }
      const total = size * size;
      p += Math.max(0, Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let k = 0; k < 8; k++) {
      applyMask(k); drawFormat(k);
      const p = penalty();
      if (p < bestP) { bestP = p; best = k; }
      applyMask(k);
    }
    applyMask(best);
    drawFormat(best);
    return mod;
  }
})();
</script>
